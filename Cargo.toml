[package]
authors = ["Elliott Pierce"]
categories = [
  "game-development",
  "graphics",
  "mathematics",
  "no-std",
  "no-std::no-alloc",
]
description = "A simple, configurable, blazingly fast noise library built for and with Bevy."
documentation = "https://docs.rs/noiz"
edition = "2024"
homepage = "https://github.com/ElliottjPierce/noiz"
keywords = ["bevy", "graphics", "math", "noise", "random"]
license = "MIT OR Apache-2.0"
name = "noiz"
readme = "README.md"
repository = "https://github.com/ElliottjPierce/noiz"
version = "0.3.0"

[dependencies]
bevy_math = { default-features = false, features = ["curve"], version = "0.17" }
bevy_reflect = { default-features = false, features = [
  "glam",
], optional = true, version = "0.17" }
serde = { default-features = false, features = [
  "derive",
], optional = true, version = "1" }

[dev-dependencies]
# for examples
bevy = "0.17"

# For benches
criterion      = "0.5"
fastnoise-lite = "1.1"
libnoise       = "1.1"
noise          = "0.9"

[features]
default = ["bevy_reflect", "serialize", "std"]

libm       = ["bevy_math/libm"]
nostd-libm = ["bevy_math/nostd-libm"]
std        = ["bevy_math/std", "bevy_reflect?/std", "serde?/std"]

bevy_reflect = ["dep:bevy_reflect"]
debug        = []
serialize    = ["bevy_math/serialize", "dep:serde"]

[profile.dev]
opt-level = 3

[profile.test]
opt-level = 1

[profile.release]
# Maximum Link Time Optimization for best performance
lto = "fat"
# Single codegen unit maximizes optimization opportunities
codegen-units = 1
# Disable incremental compilation for maximum optimization
incremental = false
opt-level   = 3

[build]
rustflags = ["-O"]


[lints.clippy]
doc_markdown                       = "warn"
manual_let_else                    = "warn"
match_same_arms                    = "warn"
needless_lifetimes                 = "allow"
nonstandard_macro_braces           = "warn"
redundant_closure_for_method_calls = "warn"
redundant_else                     = "warn"
semicolon_if_nothing_returned      = "warn"
too_many_arguments                 = "allow"
type_complexity                    = "allow"
undocumented_unsafe_blocks         = "warn"
unwrap_or_default                  = "warn"

ptr_as_ptr         = "warn"
ptr_cast_constness = "warn"
ref_as_ptr         = "warn"

too_long_first_doc_paragraph = "allow"

alloc_instead_of_core = "warn"
std_instead_of_alloc  = "warn"
std_instead_of_core   = "warn"

allow_attributes                = "warn"
allow_attributes_without_reason = "warn"

[lints.rust]
missing_docs           = "warn"
unexpected_cfgs        = { check-cfg = ['cfg(docsrs_dep)'], level = "warn" }
unsafe_op_in_unsafe_fn = "warn"
unused_qualifications  = "warn"

[[example]]
name = "show_noise"
path = "examples/show_noise.rs"

[[example]]
name = "show_gradients"
path = "examples/show_gradients.rs"

[[example]]
name = "basic"
path = "examples/basic.rs"

[[example]]
name = "heightmap"
path = "examples/heightmap.rs"

[[bench]]
harness = false
name    = "compare"
path    = "benches/compare/main.rs"
